# ───────────────── Netlify тохиргоо ─────────────────
# Next.js 16-г OpenNext adapter-оор автоматаар build хийнэ.
# Локал standalone build-ийг ашиглахгүй (next.config.ts дээр NETLIFY=true
# үед output: "standalone" автоматаар унтарна).

[build]
  # prisma generate (rhel engine-тэй) + next build
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Prisma-гийн build үеийн телеметрийг унтраана
  NEXT_TELEMETRY_DISABLED = "1"
  # DATABASE_URL нь зөвхөн локал SQLite файлын зам (нууц биш) бөгөөд
  # .env.example болон кодын тайлбарт гардаг тул secrets scan-аас хасна.
  # ADMIN_*, TURSO_* зэрэг жинхэнэ нууцууд шалгагдсаар байна.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL"

# Next.js runtime-ийг тодорхой зааж өгнө. Үгүй бол `.next` хавтас статик
# файл хэлбэрээр л publish хийгдэж, бүх хуудас 404 буцаадаг.
[[plugins]]
  package = "@netlify/plugin-nextjs"
